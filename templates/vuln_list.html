<style>
/* KPI cards */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.kpi {
  padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; text-align: left; cursor: pointer;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); font: inherit; color: inherit; position: relative;
}
.kpi:hover { border-color: var(--border-strong); box-shadow: 0 2px 8px rgba(15, 27, 45, .06); }
.kpi[aria-pressed="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
.kpi-label { color: var(--muted); font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.kpi-value { font-size: 32px; font-weight: 700; line-height: 1.15; letter-spacing: -.5px; min-height: 37px; }
.kpi-sub { font-size: 12.5px; color: var(--muted); min-height: 19px; }
.kpi .dot.navy { background: var(--navy); } .kpi .dot.blue { background: #1D4ED8; }
.t-red { color: var(--warn-red); } .t-orange { color: var(--warn-orange); }
.kpi .sk { height: 28px; width: 56px; margin: 4px 0 5px; }

/* Filters */
.filters { padding: 14px 16px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
.f-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { position: relative; flex: 1 1 300px; min-width: 220px; }
.search .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; height: 18px; pointer-events: none; }
.search input { width: 100%; height: 44px; padding: 0 12px 0 40px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); font: inherit; color: var(--text); }
.search input:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.more-panel { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px; padding-top: 12px; border-top: 1px solid var(--border); }
.more-panel .field > label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.range { display: flex; align-items: center; gap: 6px; }
.range input { min-width: 0; }
.range span { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 4px 0 12px; border-radius: 999px; background: #EEF2F8; border: 1px solid #DCE3EE; font-size: 12.5px; font-weight: 500; }
.chip b { font-weight: 600; }
.chip button { width: 26px; height: 26px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.chip button:hover { background: #DCE3EE; color: var(--text); }
.chip button .ico { width: 14px; height: 14px; }

/* Table */
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.panel-head h2 { margin: 0; font-size: 16px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
.panel-head h2 small { color: var(--muted); font-size: 13px; font-weight: 500; }
.table-scroll { overflow: auto; max-height: calc(100vh - 160px); min-height: 200px; -webkit-overflow-scrolling: touch; position: relative; }
.table-scroll[aria-busy="true"] tbody { opacity: .5; transition: opacity .15s; }
table.vt { width: 100%; min-width: 1120px; border-collapse: separate; border-spacing: 0; }
.vt th {
  position: sticky; top: 0; z-index: 2; text-align: left; font-size: 12.5px; font-weight: 600; color: #334155;
  padding: 0 10px; height: 44px; background: #F1F4F8; border-bottom: 1px solid var(--border-strong); white-space: nowrap;
}
.vt th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; height: 44px; }
.vt th button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 4px; }
.vt th .sort-ico { width: 14px; height: 14px; color: #94A3B8; }
.vt th[aria-sort="ascending"] .sort-ico, .vt th[aria-sort="descending"] .sort-ico { color: var(--navy); }
.vt th[aria-sort="ascending"] .sort-ico { transform: rotate(180deg); }
.vt td { padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: middle; }
.vt tbody tr { cursor: pointer; }
.vt tbody tr:hover td { background: #F8FAFC; }
.vt tbody tr.sk-row { cursor: default; }
.vt th:first-child, .vt td:first-child { padding-left: 16px; }
.vt th:last-child, .vt td:last-child { padding-right: 12px; text-align: right; }
.ref-link { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; text-decoration: none; }
.ref-link:hover { text-decoration: underline; }
.trunc { display: block; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trunc.sm { max-width: 150px; }
.v-title { font-weight: 600; }
.due-cell { display: flex; flex-direction: column; gap: 2px; white-space: nowrap; }
.nil { color: #94A3B8; }
.row-act { width: 36px; height: 36px; }

/* Cards (mobile) */
.cards { display: none; list-style: none; margin: 0; padding: 8px; flex-direction: column; gap: 8px; }
.vcard { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--card); text-decoration: none; color: inherit; }
.vcard:active { background: #F8FAFC; }
.vcard-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.vcard h3 { margin: 0; font-size: 14.5px; font-weight: 600; line-height: 1.35; }
.vcard-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); align-items: center; }

/* Pagination */
.pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
.pages { display: flex; gap: 4px; align-items: center; }
.pages button { min-width: 36px; height: 36px; padding: 0 8px; border: 1px solid var(--border); background: var(--card); border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text); }
.pages button:hover:not([disabled]) { background: var(--bg); }
.pages button[aria-current="page"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.pages button[disabled] { opacity: .45; cursor: default; }
.pages .gap { padding: 0 4px; }
.pages .ico { width: 16px; height: 16px; }

@media (max-width: 1200px) {
  .more-panel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 1024px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.more-btn.icon-only { position: relative; width: 44px; min-width: 44px; padding: 0; justify-content: center; flex: none; }
.more-btn.icon-only .count-badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; font-size: 11px; padding: 0 5px; }
@media (max-width: 760px) {
  .table-scroll { display: none; }
  .cards { display: flex; }
  .f-row .clear-btn { flex: none; }
  .more-panel { grid-template-columns: 1fr; }
  .search { flex: 1 1 0; min-width: 0; }
  .kpis { gap: 10px; }
  .kpi { padding: 12px 14px; }
  .kpi-value { font-size: 26px; min-height: 30px; }
  .actions { width: 100%; }
  .actions > * { flex: 1; }
  .pager { justify-content: center; }
}
</style>
</head>

      <div class="actions">

    // Drop placeholder options created for URL values now that real labels exist.
    [inputs.assignee].forEach(function (sel) {
      Array.prototype.slice.call(sel.options).forEach(function (o) { if (/^#\d+$/.test(o.textContent)) o.remove(); });
    });
    syncInputs(); renderChips();
  }, function () {});
})();
</script>
</body>
