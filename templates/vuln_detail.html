<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Эмзэг байдал — дэлгэрэнгүй | VulnReg</title>
<link rel="icon" href="/favicon.ico" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/vulnreg.css">
<style>
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600; min-height: 32px; margin-bottom: 8px; }
.back:hover { color: var(--text); }
.back .ico { width: 16px; height: 16px; }
.d-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 20px; }
.d-title { flex: 1 1 420px; min-width: 0; }
.d-ref { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; color: var(--muted); }
.d-title h1 { margin: 2px 0 10px; font-size: 22px; line-height: 1.3; font-weight: 700; letter-spacing: -.2px; overflow-wrap: anywhere; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.sec-head h2 { margin: 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.sec-head h2 small { color: var(--muted); font-weight: 500; font-size: 13px; }
.sec-body { padding: 4px 20px 16px; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; margin: 0; }
.kv > div { padding: 12px 0; border-bottom: 1px solid var(--border); min-width: 0; }
.kv > div.full { grid-column: 1 / -1; }
.kv dt { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
.kv dd { margin: 0; font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
.kv dd.text { font-weight: 400; white-space: pre-wrap; line-height: 1.55; }
.kv dd a { color: #1D4ED8; }
.kv .nil { color: #94A3B8; font-weight: 400; }
.kv > div:nth-last-child(1), .kv > div:nth-last-child(2):not(.full) { border-bottom: 0; }
.cvss-big { display: flex; align-items: center; gap: 12px; }
.cvss-big b { font-size: 20px; }
.cvss-big .cvss-meter { max-width: 200px; }
.ra-box { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: #F6F7F9; border: 1px dashed var(--border-strong); font-size: 13px; }
.ra-box b { display: block; margin-bottom: 4px; }
.ra-box.expired { background: var(--red-soft); border-color: #F5C2C2; color: var(--warn-red); }
.empty-note { padding: 16px 0 4px; color: var(--muted); font-size: 13.5px; }

/* Files */
.files { list-style: none; margin: 0; padding: 0; }
.files li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.files li:last-child { border-bottom: 0; }
.f-ico { width: 36px; height: 36px; border-radius: 8px; background: var(--track); display: grid; place-items: center; color: var(--muted); flex: none; }
.f-meta { flex: 1; min-width: 0; }
.f-meta a { font-weight: 600; color: var(--text); text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.f-meta a:hover { text-decoration: underline; }
.f-meta small { color: var(--muted); font-size: 12px; }
.drop { display: block; margin-top: 12px; border: 1.5px dashed var(--border-strong); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; background: #FAFBFC; }
.drop:hover, .drop.over { border-color: var(--navy); background: #EEF2F8; color: var(--text); }
.drop b { color: var(--text); }
.drop input { display: none; }

/* Timeline */
.timeline { list-style: none; margin: 0; padding: 8px 20px 16px; max-height: calc(100vh - 140px); overflow-y: auto; }
.tl { position: relative; padding: 10px 0 12px 30px; }
.tl::before { content: ""; position: absolute; left: 10px; top: 28px; bottom: -10px; width: 2px; background: var(--border); }
.tl:last-child::before { display: none; }
.tl-dot { position: absolute; left: 0; top: 10px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--track); color: var(--muted); }
.tl-dot .ico { width: 12px; height: 12px; stroke-width: 2.4; }
.tl-dot.status { background: #EEF0FF; color: #4338CA; }
.tl-dot.created { background: var(--green-soft); color: var(--green); }
.tl-dot.danger { background: var(--red-soft); color: var(--warn-red); }
.tl-head { font-size: 13.5px; line-height: 1.45; }
.tl-head b { font-weight: 600; }
.tl-time { font-size: 12px; color: var(--muted); margin-top: 1px; }
.tl-diff { margin-top: 6px; font-size: 12.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tl-diff .old { color: var(--muted); text-decoration: line-through; overflow-wrap: anywhere; }
.tl-diff .new { font-weight: 600; overflow-wrap: anywhere; }
.tl-diff .arrow { color: var(--muted); }
.tl-note { margin-top: 6px; padding: 8px 10px; border-radius: 8px; background: #F6F7F9; font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tl details { margin-top: 6px; font-size: 12.5px; }
.tl details summary { cursor: pointer; color: #1D4ED8; font-weight: 600; }
.tl details p { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.audit-note { padding: 10px 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.audit-note .ico { width: 14px; height: 14px; }

/* Workflow stepper, next-step banner, risk matrix */
.wf { list-style: none; margin: -8px 0 16px; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.wf li { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: var(--track); color: var(--muted); font-size: 12.5px; font-weight: 600; }
.wf .wf-n { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: #fff; font-size: 11px; }
.wf li.done { background: var(--green-soft); color: var(--green); }
.wf li.cur { background: var(--navy); color: #fff; }
.wf li.cur .wf-n { color: var(--navy); }
.next-box { display: flex; gap: 10px; align-items: center; padding: 12px 16px; margin-bottom: 16px; border-radius: 10px; background: #EEF4FF; color: #1E3A8A; border: 1px solid #C9D8FB; font-size: 13.5px; }
.next-box .ico { width: 18px; height: 18px; flex: none; }
.warn { color: var(--warn-red); }
.grp { list-style: none; margin: 0; padding: 0; }
.grp li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.grp li:last-child { border-bottom: 0; }
.grp a { flex: 1 1 220px; color: var(--text); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
.grp a:hover { text-decoration: underline; }
.imp { border-collapse: collapse; font-size: 13px; width: 100%; max-width: 420px; margin-bottom: 12px; }
.imp td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--border); }
.imp td:last-child { text-align: right; width: 40px; }
.mx { border-collapse: separate; border-spacing: 3px; font-size: 12px; margin-top: 4px; }
.mx caption { caption-side: bottom; text-align: left; color: var(--muted); font-size: 11.5px; padding-top: 4px; }
.mx th { color: var(--muted); font-weight: 600; width: 22px; text-align: center; }
.mx td { width: 34px; height: 26px; text-align: center; border-radius: 4px; font-weight: 600; color: #334155; }
.mx-low { background: #DCFCE7; } .mx-medium { background: #FEF3C7; } .mx-high { background: #FEE2E2; }
.mx td.on { outline: 3px solid var(--navy); outline-offset: -1px; color: var(--navy); }
.pill.rl-low { background: #DCFCE7; color: #166534; } .pill.rl-medium { background: #FEF3C7; color: #92400E; } .pill.rl-high { background: #FEE2E2; color: #991B1B; }
.m-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.m-grid .field.full, .m-grid > .full { grid-column: 1 / -1; }
.kv dt.cf-sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-top: 1px solid var(--border); padding-top: 10px; }
.m-stack { display: flex; flex-direction: column; gap: 14px; }
.fs { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px 14px; margin: 0; }
.fs legend { font-size: 13px; font-weight: 600; padding: 0 6px; }
@media (max-width: 600px) { .m-grid { grid-template-columns: 1fr; } }

.sk-block { display: flex; flex-direction: column; gap: 10px; padding: 16px 20px; }
@media (max-width: 1100px) {
  .layout { grid-template-columns: 1fr; }
  .timeline { max-height: none; }
}
@media (max-width: 600px) {
  .kv { grid-template-columns: 1fr; }
  .kv > div:nth-last-child(2):not(.full) { border-bottom: 1px solid var(--border); }
  .d-head .actions { width: 100%; }
  .d-head .actions > .btn-primary, .d-head .actions > .btn-secondary { flex: 1; }
  .d-title h1 { font-size: 19px; }
  .sec-head, .sec-body { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>

<script>
(function () {
  "use strict";
  var B = VR.boot, esc = VR.esc, BASE = VR.BASE, ID = B.id;
  var root = document.getElementById("root");
  var rec = null, moreMenu = null;
  VR.initShell();
  try {
    var listUrl = sessionStorage.getItem("vulnreg-list-url");
    if (listUrl && listUrl.indexOf(BASE) === 0) document.getElementById("back").href = listUrl;
  } catch (e) {}

  var YN = { yes: "Тийм", no: "Үгүй", unknown: "Тодорхойгүй" };
  var ENV_PRESENT = { yes: "Тийм", no: "Үгүй", unknown: "Тодорхойгүй" };
  var COMPROMISE = { yes: "Тийм", no: "Үгүй", checking: "Шалгаж байна" };
  var DECISION = { mitigate: "Бууруулах (Patch / Mitigate)", transfer: "Шилжүүлэх (Гэрээ / Даатгал / Нийлүүлэгч)",
    avoid: "Зайлсхийх (систем зогсоох)", accept: "Хүлээн зөвшөөрөх (CTO зөвшөөрөл)" };
  var LEVEL = { low: "Бага (Low)", medium: "Дунд (Medium)", high: "Өндөр (High)" };
  var STEPS = ["Бүртгэл", "Томилгоо", "Үнэлгээ", "Эрсдэл", "Засвар", "Баталгаажуулалт", "Хаалт"];
  var STEP_OF = { "new": 0, returned: 0, assigned: 1, under_assessment: 2, risk_assessment: 3, pending_cto: 3, accepted: 3,
    avoidance: 3, remediation: 4, verification: 5, temp_mitigation: 5, not_affected: 6, transferred: 6, closed: 6 };
  // Each button opens one form; a form may cover several server actions (e.g. save draft vs submit).
  var GROUPS = [
    { keys: ["save_assessment", "submit_assessment"], label: "Мэдээлэл бөглөх", icon: "edit", fn: openAssessment },
    { keys: ["risk_assess"], label: "Эрсдэлийн үнэлгээ", icon: "flow", fn: openRisk },
    { keys: ["cto_approve", "cto_reject"], label: "Эрсдэл хүлээн зөвшөөрөх эсэх", icon: "check", fn: openCto },
    { keys: ["save_remediation", "submit_fix", "submit_temp", "cannot_remediate"], label: "Засвар / түр хамгаалалт", icon: "wrench", fn: openRemediation },
    { keys: ["verify_fail", "verify_temp", "close"], label: "Баталгаажуулах", icon: "check", fn: openVerify },
    { keys: ["avoid_confirm"], label: "Систем зогсоосныг баталгаажуулах", icon: "check", fn: openAvoidConfirm },
    { keys: ["avoid_close"], label: "Хянаж хаах", icon: "check", fn: openAvoidClose },
    { keys: ["temp_resume"], label: "Засвар руу шилжүүлэх", icon: "wrench", fn: function () { simple("temp_resume", "Засвар руу шилжүүлэх", "Patch гарсан эсвэл түр хамгаалалт хангалтгүй болсон тул засварын шатанд буцаана.", true); } },
    { keys: ["resubmit"], label: "Засаад дахин илгээх", icon: "flow", fn: function () { var to = rec.reviewer ? "хүлээн авагчид (" + rec.reviewer.name + ")" : "хүлээн авагчид"; simple("resubmit", "Дахин илгээх", "Засварласан бүртгэлийг " + to + " дахин хянуулна.", false); } },
    { keys: ["return"], label: "Буцаах", icon: "back", fn: function () { simple("return", "InfoSec-д буцаах", "Мэдээлэл дутуу бол юуг засах шаардлагатайг бичнэ үү.", true); } }
  ];

  function nil(text) { return '<span class="nil">' + esc(text || "—") + "</span>"; }
  function val(v) { return v ? esc(v) : nil(); }
  function mono(v) { return v ? '<span class="mono">' + esc(v) + "</span>" : nil(); }
  function kv(label, valueHtml, opts) {
    opts = opts || {};
    return '<div' + (opts.full ? ' class="full"' : "") + "><dt>" + esc(label) + "</dt><dd" + (opts.text ? ' class="text"' : "") + ">" + valueHtml + "</dd></div>";
  }
  function textKv(label, v) { return kv(label, v ? esc(v) : nil("Оруулаагүй"), { full: true, text: !!v }); }
  function card(id, title, inner, extraHead) {
    return '<section class="card" aria-labelledby="h-' + id + '"><div class="sec-head"><h2 id="h-' + id + '">' + title + "</h2>" + (extraHead || "") +

  function matrixHtml(impact, likelihood, cfg) {
    var rows = "";
    for (var l = 5; l >= 1; l--) {
      rows += '<tr><th scope="row">' + l + "</th>";
      for (var i = 1; i <= 5; i++) {
        var sc = i * l, lv = sc <= cfg.low_max ? "low" : (sc <= cfg.medium_max ? "medium" : "high");
        var on = impact === i && likelihood === l;
        rows += '<td class="mx-' + lv + (on ? " on" : "") + '"' + (on ? ' aria-label="Одоогийн эрсдэл"' : "") + ">" + sc + "</td>";
      }
      rows += "</tr>";
    }
    return '<table class="mx" aria-label="5×5 эрсдэлийн матриц"><caption>Магадлал ↑ · Нөлөөлөл →</caption><tbody>' + rows +
      '<tr><th></th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></tbody></table>';

  function wire() {

      input.addEventListener("change", function () { if (input.files.length) upload(input.files); input.value = ""; });
      ["dragenter", "dragover"].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
      ["dragleave", "drop"].forEach(function (t) { drop.addEventListener(t, function () { drop.classList.remove("over"); }); });
      drop.addEventListener("drop", function (e) { e.preventDefault(); if (e.dataTransfer.files.length) upload(e.dataTransfer.files); });
    }
  }
  function onAct(e) {

  // ---------- Modals ----------

  function modal(title, sub, bodyHtml, buttons, wide) {
    var dlg = document.createElement("dialog");

    dlg.setAttribute("aria-labelledby", "md-title");
    buttons = typeof buttons === "string" ? [{ label: buttons, value: "", primary: true }] : buttons;
    dlg.innerHTML = '<form novalidate><div class="m-head"><div><h2 id="md-title">' + esc(title) + "</h2><p>" + esc(sub) + "</p></div>" +
      '<button type="button" class="icon-btn" data-close aria-label="Хаах"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button></div>' +
      '<div class="m-body"><div class="m-alert" role="alert" data-alert></div>' + bodyHtml + "</div>" +
      '<div class="m-foot"><button type="button" class="btn-secondary" data-close>Болих</button>' + buttons.map(function (b) {
        return '<button type="submit" class="' + (b.primary ? "btn-primary" : "btn-secondary") + '" data-submit value="' + esc(b.value) + '">' + esc(b.label) + "</button>";
      }).join("") + "</div></form>";
    Array.prototype.forEach.call(dlg.querySelectorAll("[data-close]"), function (b) { b.addEventListener("click", function () { dlg.close(); }); });
    dlg.addEventListener("close", function () { dlg.remove(); });
    return dlg;
  }
  function submitTo(dlg, url, collect, before, onSuccess) {
    var form = dlg.querySelector("form"), alertBox = dlg.querySelector("[data-alert]");
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var which = ev.submitter ? ev.submitter.value : "";
      alertBox.textContent = "";
      VR.setErrors(form, {});
      var data = collect(form, which);
      if (!data) { alertBox.textContent = "Улаанаар тэмдэглэсэн талбаруудыг бөглөнө үү."; return; }
      (before ? before(data) : Promise.resolve(true)).then(function (go) {
        if (!go) return;
        var btns = dlg.querySelectorAll("[data-submit]");
        Array.prototype.forEach.call(btns, function (b) { b.disabled = true; });
        VR.api(url, { form: data }).then(function (r) {
          Array.prototype.forEach.call(btns, function (b) { b.disabled = false; });
          if (!r.ok) {
            alertBox.textContent = r.data.error || "Алдаа гарлаа.";
            if (r.data.fields) VR.setErrors(form, r.data.fields);
            return;
          }
          dlg.close();
          if (onSuccess && onSuccess(r, data)) { load(); return; }
          done(r);
        });
      });
    });
  }
  var ACTION_URL = function () { return BASE + "/api/" + rec.id + "/action"; };
  function fld(name, label, opts) {

    else if (opts.type === "select") input = '<select id="' + id + '" name="' + name + '"><option value="">— Сонгох —</option>' + opts.options.map(function (o) {
      return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(v) ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join("") + "</select>";
    else input = '<input id="' + id + '" name="' + name + '" type="' + (opts.type || "text") + '" value="' + esc(v) + '"' + (opts.max ? ' maxlength="' + opts.max + '"' : "") +

  /* Field from the form designer schema rendered with fld(); extra = fixed rendering details of a built-in. */
  function schemaFld(f, extra, value) {
    var o = { req: f.required, full: !!f.full, hint: f.hint || "", ph: f.ph || "", value: value };
    if (!f.builtin) {
      if (f.type === "textarea") { o.type = "textarea"; o.max = f.max || 5000; }
      else if (f.type === "select" || f.type === "yesno") { o.type = "select"; o.options = VR.customOptions(f); }
      else if (f.type === "date" || f.type === "url" || f.type === "email") o.type = f.type;
      else o.max = f.type === "number" ? 40 : (f.max || 300);
    }
    Object.keys(extra || {}).forEach(function (k) { o[k] = extra[k]; });
    if (o.hint === "") delete o.hint;
    if (o.ph === "") delete o.ph;
    return fld(f.key, f.label, o);
  }
  /* Sections of a designer-managed form. render(f) returns the html of a built-in (null → generic field). */
  function schemaBody(formKey, render, values) {
    var multi = VR.form(formKey).sections.length > 1;
    return VR.form(formKey).sections.map(function (s) {
      var vis = s.fields.filter(function (f) { return !f.hidden; });
      var html = vis.map(function (f) {
        var h = f.builtin ? render(f) : null;
        return h != null ? h : schemaFld(f, null, (values || {})[f.key] || "");
      }).join("");
      return (multi || s.desc ? '<h3 class="m-sec">' + esc(s.title) + "</h3>" : "") +
        (s.desc ? '<div class="m-alert info">' + esc(s.desc) + "</div>" : "") + grid(html);
    }).join("");
  }
  /* Posted names + required names of the visible plain fields of a form (built-in blocks excluded). */
  function schemaNames(formKey) {
    var names = [], required = [];
    VR.formFields(formKey).forEach(function (f) {
      if (f.hidden || f.block) return;
      names.push(f.key);
      if (f.required) required.push(f.key);
    });
    return { names: names, required: required };
  }

    submitTo(dlg, ACTION_URL(), function (f, which) {

    }, function (d) {

        VR.confirm({ title: "InfoSec-д илгээх үү?", body: "Илгээсний дараа мэдээллийг InfoSec хянаж, хөрөнгөд нөлөөлсөн эсэхийг тодорхойлно. Шалгасан огноо автоматаар бүртгэгдэнэ.", confirmLabel: "Илгээх" });

      });

      grid(fld("as_affected", "Хөрөнгөд нөлөөлсөн эсэх", { type: "select", req: true, options: YN_OPTS, value: rec.impactDecision.affected || "", full: false,
        hint: "Үгүй бол тайлбар бичиж «Нөлөөлөөгүй – Хаагдсан» болгоно (нотлох баримтыг «Нотлох баримт» хэсэгт хавсаргана)." })) +
      fld("ia_note", "Нөлөөллийн тайлбар", { type: "textarea", max: 5000, value: rec.impactDecision.note || "", attr: ' data-show="ia-note"',

    var body = affectedPart + '<div data-risk-part>' +

      schemaBody("risk", function (f) {
        if (f.key === "ra_threat") return schemaFld(f, { type: "textarea", value: rk.threat, max: 5000 });
        if (f.key === "impacts") return '<fieldset class="fs full"><legend>' + esc(f.label) + "</legend>" + grid(impacts) +
          (f.hint ? '<span class="hint">' + esc(f.hint) + "</span>" : "") + "</fieldset>";
        if (f.key === "ra_likelihood") return fld("ra_likelihood", f.label, { type: "select", req: true, options: opts15, value: rk.likelihood || "", full: false, hint: f.hint || undefined }) +
          '<div class="field"><span class="label">Эрсдэлийн түвшин (5×5)</span><output class="derived" data-level aria-live="polite">—</output></div>' +
          '<div class="full" data-matrix></div>';
        if (f.key === "ra_decision") return '<div class="field full" role="radiogroup" aria-label="' + esc(f.label) + '"><span class="label">' + esc(f.label) + '</span><div class="opt-list">' + decisions + "</div>" +
          (f.hint ? '<span class="hint">' + esc(f.hint) + "</span>" : "") + '<span class="err-msg" data-err="ra_decision"></span></div>';
        if (f.key === "ra_decision_note") return schemaFld(f, { type: "textarea", value: rk.decisionNote, max: 5000, noReq: !f.required });
        if (f.key === "risk_accept_until") return fld("risk_accept_until", f.label, { type: "date", req: true, min: VR.addDays(VR.todayIso, 1),

      }, rec.custom) + "</div>";
    var dlg = modal("Эрсдэлийн үнэлгээ (MAS-14)", rec.ref + " · " + rec.title, body,

    var form = dlg.querySelector("form");
    function sync() {
      var d = formData(form, ["ra_likelihood", "ra_decision"]), vals = [];
      for (var i = 1; i <= 8; i++) vals.push(parseInt(form.querySelector('[name="impact_' + i + '"]').value, 10));
      var complete = vals.every(function (v) { return v >= 1; }) && d.ra_likelihood;
      var imp = complete ? Math.max.apply(null, vals) : null, lk = complete ? +d.ra_likelihood : null;
      var sc = complete ? imp * lk : null, lv = !complete ? "" : (sc <= cfg.low_max ? "low" : (sc <= cfg.medium_max ? "medium" : "high"));
      form.querySelector("[data-level]").innerHTML = complete ? levelPill(lv) + ' <span class="muted">' + imp + " × " + lk + " = " + sc + "</span>" : '<span class="muted">Бүх шалгуурыг бөглөнө үү</span>';
      form.querySelector("[data-matrix]").innerHTML = matrixHtml(imp, lk, cfg);
      form.querySelector('[data-show="accept"]').hidden = d.ra_decision !== "accept";
      if (askAffected) {
        var notAffected = form.querySelector('[name="as_affected"]').value === "no";
        form.querySelector("[data-risk-part]").hidden = notAffected;  // Үгүй → no risk assessment, the record closes
        var decideBtn = form.querySelector('[data-submit][value="decide"]');
        if (decideBtn) decideBtn.textContent = notAffected ? "Нөлөөлөөгүй — хаах" : "Шийдвэр батлах";
        var draftBtn = form.querySelector('[data-submit][value="draft"]');
        if (draftBtn) draftBtn.hidden = notAffected;
      }
    }
    form.addEventListener("change", sync); sync();
    if (askAffected) form.querySelector('[name="as_affected"]').addEventListener("change", function () {
      VR.setErrors(form, {});  // a new answer starts clean: drop errors from the other branch
      form.querySelector("[data-alert]").textContent = "";
    });
    submitTo(dlg, ACTION_URL(), function (f, which) {
      var sn = schemaNames("risk");
      var names = ["ra_likelihood", "ra_decision", "risk_accept_until"].concat(sn.names);
      for (var i = 1; i <= 8; i++) names.push("impact_" + i);
      if (askAffected) names.push("as_affected", "ia_note");
      var d = formData(f, names);
      if (which === "draft") { d.ra_decision = ""; d.action = "risk_assess"; return d; }
      if (askAffected && d.as_affected === "no") {
        if (!requireFields(f, d, ["ia_note"])) return null;
        return { action: "risk_assess", as_affected: "no", ia_note: d.ia_note };
      }
      var req = ["ra_likelihood", "ra_decision"].concat(sn.required);
      for (var j = 1; j <= 8; j++) req.push("impact_" + j);
      if (askAffected) req.push("as_affected");
      if (d.ra_decision === "accept") req.push("risk_accept_until");
      if (["transfer", "avoid", "accept"].indexOf(d.ra_decision) >= 0 && req.indexOf("ra_decision_note") < 0) req.push("ra_decision_note");
      if (!requireFields(f, d, req)) return null;
      d.action = "risk_assess"; return d;
    }, function (d) {
      if (d.as_affected === "no")
        return VR.confirm({ title: "Нөлөөлөөгүй гэж хаах уу?", body: rec.ref + " бүртгэлийг «" + VR.STATUS.not_affected + "» төлөвтэй хаана. Хүлээн авагч, CTO-д мэдэгдэл очно.", confirmLabel: "Хаах" });
      if (!d.ra_decision) return Promise.resolve(true);
      return VR.confirm({ title: "Шийдвэр батлах уу?", body: DECISION[d.ra_decision] + " — " + rec.ref, confirmLabel: "Батлах" });
    });
    VR.showModal(dlg, form.querySelector(askAffected ? "select" : "textarea, select"));
  }

  function openAssign() {
    VR.options().then(function (O) {
      var engineers = O.engineers || [];
      var body =
        '<div class="field"><span class="label">Мэдээллийн хөрөнгө / Систем</span><div>' + (rec.assetInfo ? esc(rec.assetInfo.name) + (rec.assetInfo.id ? ' <span class="muted">#' + rec.assetInfo.id + "</span>" : "") : nil("Холбоогүй")) + "</div></div>" +
        (engineers.length ? "" : '<div class="m-alert">Инженер эрхтэй хэрэглэгч алга. Админ (InfoSec) Тохиргоо → Эрх олгох хэсэгт инженер эрх олгоно.</div>') +
        '<div class="field"><label for="as-user">Хариуцах инженер<span class="req">*</span></label><div class="combo"><input id="as-user" type="text" placeholder="Инженерийн нэрээр хайх…"><input type="hidden" name="assignee_id"></div><span class="err-msg" data-err="assignee_id"></span></div>' +
        '<div class="field"><label for="as-note">Тайлбар</label><textarea id="as-note" name="note" maxlength="5000" rows="3" placeholder="Инженерт өгөх заавар, анхаарах зүйл"></textarea></div>' +
        '<p class="hint" style="margin:0">Томилогдсон инженерт и-мэйлээр мэдэгдэл очно.' + (rec.status === "new" ? " Төлөв «" + esc(VR.STATUS.assigned) + "» болно." : "") + "</p>";
      var dlg = modal(rec.assignee ? "Инженер солих" : "Инженер томилох", rec.ref + " · " + rec.title, body, rec.assignee ? "Солих" : "Томилох");
      var form = dlg.querySelector("form");
      var combo = VR.combo(form.querySelector("#as-user"), form.querySelector('[name="assignee_id"]'),
        engineers.map(function (u) { return { id: u.id, label: u.name, sub: u.dept }; }));
      if (rec.assignee) combo.setValue(rec.assignee.id, true);
      submitTo(dlg, BASE + "/api/" + rec.id + "/assign", function (f) {
        var id = f.querySelector('[name="assignee_id"]').value;
        if (!id) { VR.setErrors(f, { assignee_id: "Жагсаалтаас сонгоно уу." }); return null; }
        return { assignee_id: id, note: f.querySelector('[name="note"]').value.trim() };
      });
      VR.showModal(dlg, form.querySelector("#as-user"));
    }, function (err) { VR.toast(err.message || "Алдаа гарлаа.", "err"); });
  }

  function openComment() {
    var body = '<div class="field"><label for="cm-text">Сэтгэгдэл<span class="req">*</span></label><textarea id="cm-text" name="comment" maxlength="5000" rows="5" placeholder="Хяналтын тэмдэглэл, асуулт, нэмэлт мэдээлэл"></textarea><span class="err-msg" data-err="comment"></span></div>' +
      '<p class="hint" style="margin:0">Сэтгэгдэл түүхэнд бүртгэгдэх бөгөөд засах, устгах боломжгүй.</p>';
    var dlg = modal("Сэтгэгдэл нэмэх", rec.ref + " · " + rec.title, body, "Нэмэх");
    submitTo(dlg, BASE + "/api/" + rec.id + "/comment", function (f) {
      var t = f.querySelector('[name="comment"]').value.trim();
      if (!t) { VR.setErrors(f, { comment: "Сэтгэгдэл бичнэ үү." }); return null; }
      return { comment: t };
    });
    VR.showModal(dlg, dlg.querySelector("textarea"));
  }

  function deleteRecord() {
    VR.confirm({
      title: "Бүртгэл устгах уу?",
      body: rec.ref + " — «" + rec.title + "» бүртгэлийг жагсаалтаас устгана. Түүх, файлууд аудитын зорилгоор хадгалагдах тул администратор сэргээх боломжтой.",
      extraHtml: '<div class="field"><label for="del-reason">Шалтгаан</label><textarea id="del-reason" rows="2" maxlength="2000"></textarea></div>',
      confirmLabel: "Устгах", danger: true,
      collect: function (dlg) { return { reason: dlg.querySelector("#del-reason").value.trim() }; }
    }).then(function (res) {
      if (!res) return;
      VR.api(BASE + "/api/" + rec.id + "/delete", { form: { reason: res.reason || "" } }).then(function (r) {
        if (!r.ok) { VR.toast(r.data.error || "Устгаж чадсангүй.", "err"); return; }
        try { sessionStorage.setItem("vulnreg-flash", rec.ref + " устгагдлаа."); } catch (e) {}
        location.href = document.getElementById("back").href;
      });
    });
  }

  load().then(function () {
    if (rec && rec.perms.edit && /[?&]edit=1(&|$)/.test(location.search)) {
      history.replaceState(null, "", location.pathname);
      openEdit();
    }
  });
})();
</script>
</body>
</html>
